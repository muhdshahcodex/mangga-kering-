<!doctype html>
<html
  lang="ms"
  data-composition-variables='[{"id":"accent","type":"color","label":"Warna aksen","default":"#FFE14A"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b0b0d;
        --ink: #ffffff;
        --accent: #ffe14a;
        --font-display: "Archivo Black", sans-serif;
        --font-body: "Montserrat", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .shot { position: absolute; inset: 0; overflow: hidden; transform-origin: 50% 50%; }
      .shot video {
        position: absolute; left: 0; top: 0;
        width: 1080px; height: 1920px; object-fit: cover;
      }
      .scene-host { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="17"
      data-width="1080"
      data-height="1920"
    >
      <!-- FOOTAGE (B-roll, tiada suara asal) -->
      <div class="shot" id="w1" style="z-index:1"><video id="v1" class="clip" src="assets/footage/clip5.mp4" data-start="0" data-duration="1.6" data-media-start="0.6" data-track-index="0" muted playsinline></video></div>
      <div class="shot" id="w2" style="z-index:2"><video id="v2" class="clip" src="assets/footage/clip2.mp4" data-start="1.6" data-duration="1.1" data-media-start="0" data-track-index="0" muted playsinline></video></div>
      <div class="shot" id="w3" style="z-index:3"><video id="v3" class="clip" src="assets/footage/clip3.mp4" data-start="2.7" data-duration="2.5" data-media-start="0" data-track-index="0" muted playsinline></video></div>
      <div class="shot" id="w4" style="z-index:4"><video id="v4" class="clip" src="assets/footage/clip2.mp4" data-start="5.2" data-duration="1.9" data-media-start="4.9" data-track-index="0" muted playsinline></video></div>
      <div class="shot" id="w5" style="z-index:5"><video id="v5" class="clip" src="assets/footage/clip3.mp4" data-start="7.1" data-duration="1.3" data-media-start="6.2" data-track-index="0" muted playsinline></video></div>
      <div class="shot" id="w6" style="z-index:6"><video id="v6" class="clip" src="assets/footage/clip5.mp4" data-start="8.4" data-duration="1.4" data-media-start="4.4" data-track-index="0" muted playsinline></video></div>
      <div class="shot" id="w7" style="z-index:7"><video id="v7" class="clip" src="assets/footage/clip3.mp4" data-start="9.8" data-duration="1.7" data-media-start="7.0" data-track-index="0" muted playsinline></video></div>
      <div class="shot" id="w8" style="z-index:8"><video id="v8" class="clip" src="assets/footage/clip5.mp4" data-start="11.5" data-duration="0.7" data-media-start="2.4" data-track-index="0" muted playsinline></video></div>
      <div class="shot" id="w9" style="z-index:9"><video id="v9" class="clip" src="assets/footage/clip4.mp4" data-start="12.2" data-duration="0.6" data-media-start="0.5" data-track-index="0" muted playsinline></video></div>
      <div class="shot" id="w10" style="z-index:10"><video id="v10" class="clip" src="assets/footage/clip4.mp4" data-start="12.8" data-duration="0.7" data-media-start="2.6" data-track-index="0" muted playsinline></video></div>
      <div class="shot" id="w11" style="z-index:11"><video id="v11" class="clip" src="assets/footage/clip1.mp4" data-start="13.5" data-duration="3.5" data-media-start="1.0" data-track-index="0" muted playsinline></video></div>

      <!-- GRAFIK (satu scene setiap babak) -->
      <div id="hook" class="scene-host" style="z-index:20" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="2.7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="slim" class="scene-host" style="z-index:20" data-composition-id="slim" data-composition-src="compositions/slim.html" data-start="2.7" data-duration="2.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="magnet" class="scene-host" style="z-index:20" data-composition-id="magnet" data-composition-src="compositions/magnet.html" data-start="5.2" data-duration="3.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="port" class="scene-host" style="z-index:20" data-composition-id="port" data-composition-src="compositions/port.html" data-start="8.4" data-duration="1.4" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="capacity" class="scene-host" style="z-index:20" data-composition-id="capacity" data-composition-src="compositions/capacity.html" data-start="9.8" data-duration="1.7" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="checks" class="scene-host" style="z-index:20" data-composition-id="checks" data-composition-src="compositions/checks.html" data-start="11.5" data-duration="2" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="cta" class="scene-host" style="z-index:20" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="13.5" data-duration="3.5" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- MUZIK LATAR (dijana lokal, 125 BPM) -->
      <audio id="bgm" class="clip" src="assets/bgm/track.mp3" data-start="0" data-duration="17" data-track-index="9" data-volume="0.7"></audio>

      <!-- SFX (peak diselaraskan 1 frame selepas visual) -->
      <audio id="sfx-hook" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0" data-duration="2.0" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-w1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="1.47" data-duration="0.5" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-w2" class="clip" src="assets/sfx/whoosh.mp3" data-start="2.57" data-duration="0.5" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-w3" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="2.73" data-duration="4.0" data-track-index="12" data-volume="0.45" data-media-start="0"></audio>
      <audio id="sfx-pop1" class="clip" src="assets/sfx/pop.mp3" data-start="5.36" data-duration="0.4" data-track-index="13" data-volume="0.9"></audio>
      <audio id="sfx-pop2" class="clip" src="assets/sfx/pop.mp3" data-start="7.31" data-duration="0.4" data-track-index="13" data-volume="0.9"></audio>
      <audio id="sfx-w4" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="8.27" data-duration="0.5" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-w5" class="clip" src="assets/sfx/whoosh.mp3" data-start="9.67" data-duration="0.5" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-pop3" class="clip" src="assets/sfx/pop.mp3" data-start="10.86" data-duration="0.4" data-track-index="13" data-volume="0.9"></audio>
      <audio id="sfx-c1" class="clip" src="assets/sfx/click.mp3" data-start="11.61" data-duration="0.3" data-track-index="14" data-volume="1"></audio>
      <audio id="sfx-c2" class="clip" src="assets/sfx/click.mp3" data-start="11.86" data-duration="0.3" data-track-index="16" data-volume="1"></audio>
      <audio id="sfx-c3" class="clip" src="assets/sfx/click.mp3" data-start="12.11" data-duration="0.3" data-track-index="14" data-volume="1"></audio>
      <audio id="sfx-c4" class="clip" src="assets/sfx/click.mp3" data-start="12.36" data-duration="0.3" data-track-index="16" data-volume="1"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="10.06" data-duration="3.45" data-track-index="15" data-volume="0.35" data-fade-out="0.15"></audio>
      <audio id="sfx-cta" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="13.46" data-duration="2.0" data-track-index="10" data-volume="0.55"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Hook: frame 0 sudah penuh, sedikit "slam" settle
      tl.fromTo("#w1", { scale: 1.14 }, { scale: 1.0, duration: 0.45, ease: "expo.out" }, 0);
      // Potongan ke shot 2 dengan punch-in kecil
      tl.fromTo("#w2", { scale: 1.08 }, { scale: 1.0, duration: 0.35, ease: "power3.out" }, 1.6);
      // Magnetic: cut masuk sedikit besar, settle
      tl.fromTo("#w4", { scale: 1.1 }, { scale: 1.0, duration: 0.4, ease: "expo.out" }, 5.2);
      // Port: punch-in ke port USB-C
      tl.fromTo("#w6", { scale: 1.0 }, { scale: 1.18, duration: 0.5, ease: "power3.out", transformOrigin: "55% 48%" }, 8.45);
      // Kapasiti: punch-in ke label spec
      tl.fromTo("#w7", { scale: 1.0 }, { scale: 1.45, duration: 0.7, ease: "power2.inOut", transformOrigin: "50% 76%" }, 10.0);
      // CTA: masuk besar, settle
      tl.fromTo("#w11", { scale: 1.12 }, { scale: 1.0, duration: 0.5, ease: "expo.out" }, 13.5);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
